<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Veterinaria San Marcos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style.css">

    <script src="js/main.js" defer></script>
    <script src="js/carrito.js" defer></script>
</head>

<body>

    <header class="site-header">
        <div class="logo">
            <img src="img/logo.png" alt="Logo Veterinaria San Marcos">
            <span>Veterinaria San Marcos</span>
        </div>

        <button class="menu-toggle" aria-label="Abrir menú">☰</button>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="servicios.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>

        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </div>
    </header>

    <main>
        <section id="carrito">
            <h2 class="servicios-nombre">Tu Carrito de Compras</h2>

            <div class="carrito-contenido">
                <div class="tabla-carrito-wrap">
                    <table class="tabla-carrito">
                        <thead>
                            <tr>
                                <th scope="col">Producto</th>
                                <th scope="col">Precio</th>
                                <th scope="col">Cantidad</th>
                                <th scope="col">Subtotal</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody id="carrito-items">
                            <!-- JS inserta aquí cada línea del carrito -->
                        </tbody>
                    </table>
                </div>

                <p id="carrito-vacio" hidden>Tu carrito está vacío. <a href="servicios.html">Ver productos</a></p>

                <div class="carrito-resumen">
                    <p class="carrito-total">Total: <span id="carrito-total">$0</span></p>
                    <button id="btn-vaciar" class="btn btn-outline-danger" type="button">Vaciar carrito</button>
                    <button id="btn-pagar" class="btn btn-success" type="button">Pagar</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Veterinaria San Marcos</p>
        <nav>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </footer>

</body>

</html>
