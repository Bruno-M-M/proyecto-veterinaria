    <link rel="stylesheet" href="css/style.css">

    <script src="js/main.js" defer></script>
    <script src="js/productos-data.js" defer></script>

<body>

    <header class="site-header">
        <div class="logo">
            <img src="img/logo.png" alt="Logo Veterinaria San Marcos">

        </div>

        <button class="menu-toggle" aria-label="Abrir menú">☰</button>

        <nav class="main-nav">

            <div class="select-categoria">

                <select id="categoria-select" class="categoria-select">
                    <option value="todas" selected>Todas las categorías</option>
                    <option value="antibioticos">Antibióticos</option>
                    <option value="antiparasitarios">Antiparasitarios</option>
                    <option value="antiinflamatorios">Antiinflamatorios</option>
                    <option value="dermatologia">Dermatología</option>

                    <option value="cardiaco">Cardíaco</option>
                    <option value="analgesicos">Analgésicos</option>

            </div>

            <div class="servicios"></div>
        </section>

    <footer class="site-footer">
        <nav>
            <section class="foter-nosotros">
