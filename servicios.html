<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - Veterinaria San Marcos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style.css">

    <script src="js/main.js" defer></script>
    <script src="js/servicios-data.js" defer></script>
    <script src="js/servicios.js" defer></script>
</head>

<body>

    <header class="site-header">
        <div class="logo">
            <img src="img/logo.png" alt="Logo Veterinaria San Marcos">
            <span>Veterinaria San Marcos</span>
        </div>

        <button class="menu-toggle" aria-label="Abrir menú">☰</button>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>

        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </div>
    </header>

    <main>

        <!--PRODUCTOS: lista continua, sin dividir por categoria-->
        <section id="servicios">
            <div class="select-categoria">
                <h2 class="servicios-nombre">Nuestros Servicios</h2>

                <select id="select-cita" class="categoria-select">
                    <option value="" selected>Selecciona una categoria</option>
                    <option value="consulta">Consultas</option>
                    <option value="vacunacion">Vacunación</option>
                    <option value="cirugia">Cirugía</option>
                    <option value="desparacitacion">Desparasitación</option>
                    <option value="examenes">Exámenes</option>
                    <option value="otros">Otros</option>
                </select>
            </div>

            <div class="servicios"></div>
        </section>

        <div id="modal-cita" class="modal-overlay" hidden>
            <div class="modal-contenido">
                <button type="button" id="modal-cerrar" class="modal-cerrar" aria-label="Cerrar">&times;</button>
                <h3 id="modal-titulo">Agendar cita</h3>

                <form id="form-cita" class="form-producto" novalidate>
                    <div class="campo">
                        <label for="campo-nombre-dueno">Nombre</label>
                        <input type="text" id="campo-nombre-dueno" maxlength="100">
                        <p class="campo-error" id="error-nombre-dueno"></p>
                    </div>

                    <div class="campo">
                        <label for="campo-contacto">Correo o teléfono</label>
                        <input type="text" id="campo-contacto" maxlength="100">
                        <p class="campo-error" id="error-contacto"></p>
                    </div>

                    <div class="campo">
                        <label for="campo-mascota">Nombre de la mascota</label>
                        <input type="text" id="campo-mascota" maxlength="50">
                        <p class="campo-error" id="error-mascota"></p>
                    </div>

                    <div class="campo" id="campo-especie-wrap" hidden>
                        <label for="campo-especie">Especie de tu mascota</label>
                        <input type="text" id="campo-especie" maxlength="30">
                        <p class="campo-error" id="error-especie"></p>
                    </div>

                    <div class="campo">
                        <label for="campo-fecha">Fecha</label>
                        <input type="date" id="campo-fecha">
                        <p class="campo-error" id="error-fecha"></p>
                    </div>

                    <div class="campo">
                        <label for="campo-hora">Hora</label>
                        <input type="time" id="campo-hora">
                        <p class="campo-error" id="error-hora"></p>
                    </div>

                    <div class="campo">
                        <label for="campo-observaciones">Observaciones (opcional)</label>
                        <textarea id="campo-observaciones" maxlength="300" rows="3"></textarea>
                    </div>

                    <p id="modal-mensaje" class="form-mensaje" hidden></p>

                    <button type="submit" class="btn btn-success">Confirmar cita</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <nav>
            <section class="foter-nosotros">
            <a href="nosotros.html">Nosotros</a>
            </section>
            <section class="foter-contacto">
            <a href="contacto.html">Contacto</a>
            </section>
        </nav>
        <p>&copy; 2026 Veterinaria San Marcos</p>
    </footer>

</body>

</html>
