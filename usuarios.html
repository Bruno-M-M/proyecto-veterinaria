<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios</title>
  <link rel="stylesheet" href="css/usuarios.css">
  
  <script src="js/usuarios-data.js" defer></script>
  <script src="js/usuarios.js" defer></script>

  <style>
    /* Estilos integrados para el Modal de Edición */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h3 { margin: 0; font-size: 1.25rem; }
    .btn-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;
    }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-secondary { background: #6b7280; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-action-edit { background: #2563eb; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .btn-action-edit:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <aside class="sidebar">
      <div class="brand">
        <span class="logo-icon">⬡</span>
        <span>AdminPanel</span>
      </div>
      <nav class="menu">
        <a href="#" class="menu-item">Dashboard</a>
        <a href="#" class="menu-item active">Usuarios</a>
        <a href="#" class="menu-item">Reportes</a>
        <a href="#" class="menu-item">Configuración</a>
      </nav>
    </aside>

    <main class="main-content">
      
      <header class="header">
        <div>
          <h1>Lista de Usuarios</h1>
          <p class="subtitle">Administra la información de usuarios registrados</p>
        </div>
        <div class="header-actions">
<a href="registro.html" class="btn-primary" style="text-decoration: none; display: inline-block;">NUEVO USUARIO</a>        </div>
      </header>

      <div class="controls-bar">
        <input type="text" id="searchInput" placeholder="Buscar por nombre, RUN, correo, región, comuna..." class="search-input">
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Nombre <span class="sort-icon">⇕</span></th>
              <th>RUN</th>
              <th>Correo <span class="sort-icon">⇕</span></th>
              <th>Región</th>
              <th>Comuna</th>
              <th>Tipo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Filas dinámicas generadas desde JS -->
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <button class="page-btn">&laquo;</button>
        <button class="page-btn">&lt;</button>
        <button class="page-btn page-num active">1</button>
        <button class="page-btn page-num">2</button>
        <button class="page-btn page-num">3</button>
        <button class="page-btn">&gt;</button>
        <button class="page-btn">&raquo;</button>
      </div>

    </main>
  </div>

  <!-- Modal para Editar Usuario -->
  <div class="modal-overlay" id="modalEditar">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Editar Usuario</h3>
        <button class="btn-close" id="btnCerrarModal">&times;</button>
      </div>
      <form id="formEditarUsuario">
        <input type="hidden" id="editUserIndex">
        
        <div class="form-group">
          <label for="editNombre">Nombre Completo</label>
          <input type="text" id="editNombre" required>
        </div>

        <div class="form-group">
          <label for="editRun">RUN</label>
          <input type="text" id="editRun" required maxlength="9">
        </div>

        <div class="form-group">
          <label for="editCorreo">Correo Electrónico</label>
          <input type="email" id="editCorreo" required>
        </div>

        <div class="form-group">
          <label for="editRegion">Región</label>
          <select id="editRegion" required></select>
        </div>

        <div class="form-group">
          <label for="editComuna">Comuna</label>
          <select id="editComuna" required></select>
        </div>

        <div class="form-group">
          <label for="editTipo">Tipo de Usuario</label>
          <select id="editTipo" required>
            <option value="Administrador">Administrador</option>
            <option value="Cliente">Cliente</option>
            <option value="Vendedor">Vendedor</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="btnCancelarEditar">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
