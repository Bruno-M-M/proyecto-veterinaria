<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veterinaria San Marcos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/nuevoUsuario.css">
  <script src="js/nuevoUsuario.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <img src="img/logo.png" alt="Logo Veterinaria San Marcos">
      <span>Veterinaria San Marcos</span>
    </div>

    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>

    <div class="user-actions">
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html">Registrarse</a>
    </div>
  </header>

  <main class="flex-grow-1">
    <section id="registro" class="bg-light py-5 min-vh-100">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">
            <h2 class="text-center mb-4">Registro de usuario</h2>

            <form id="formulario-registro" class="border rounded p-4 shadow bg-white" novalidate>
              
              <div class="mb-3">
                <label for="nombreRegistro" class="form-label">Nombre completo</label>
                <input 
                  type="text"
                  id="nombreRegistro"
                  class="form-control"
                  placeholder="Ingrese su nombre"
                >
              </div>

              <div class="mb-3">
                <label for="correoRegistro" class="form-label">Correo Electrónico</label>
                <input 
                  type="email"
                  id="correoRegistro"
                  class="form-control"
                  placeholder="nombre@correo.cl"
                >
              </div>

              <div class="mb-3">
                <label for="correoConfirmar" class="form-label">Confirmar Correo Electrónico</label>
                <input 
                  type="email"
                  id="correoConfirmar"
                  class="form-control"
                  placeholder="nombre@correo.cl"
                >
              </div>

              <!-- Nuevo campo: Tipo de Usuario -->
              <div class="mb-3">
                <label for="tipoUsuario" class="form-label">Tipo de Usuario</label>
                <select id="tipoUsuario" class="form-select">
                  <option value="" disabled selected>Seleccione un tipo de usuario</option>
                  <option value="Administrador">Administrador</option>
                  <option value="Cliente">Cliente</option>
                  <option value="Vendedor">Vendedor</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input 
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Contraseña"
                >
              </div>

              <div class="mb-3">
                <label for="passwordConfirmar" class="form-label">Confirmar Contraseña</label>
                <input 
                  type="password"
                  id="passwordConfirmar"
                  class="form-control"
                  placeholder="Contraseña"
                >
              </div>

              <button type="submit" class="btn btn-primary w-100">Registrar</button>
            </form>

            <div id="mensaje-resultado" class="mt-4" role="alert"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Veterinaria San Marcos</p>
    <nav>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
