<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto - Veterinaria San Marcos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style.css">

    <script src="js/main.js" defer></script>
    <script src="js/productos-data.js" defer></script>
    <script src="js/productos-storage.js" defer></script>
    <script src="js/detalle-producto.js" defer></script>
</head>

<body>

    <header class="site-header">
        <div class="logo">
            <img src="img/logo.png" alt="Logo Veterinaria San Marcos">
            <span>Veterinaria San Marcos</span>
        </div>

        <button class="menu-toggle" aria-label="Abrir menú">☰</button>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="servicios.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>

        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </div>
    </header>

    <main>
        <section id="detalle-producto">
            <p class="volver"><a href="servicios.html">&larr; Volver a productos</a></p>

            <div id="detalle-contenido" class="detalle-contenido" hidden>
                <p class="detalle-categoria" id="detalle-categoria"></p>
                <h2 id="detalle-nombre"></h2>
                <p class="detalle-descripcion" id="detalle-descripcion"></p>
                <p class="detalle-precio" id="detalle-precio"></p>

                <div class="detalle-cantidad">
                    <span>Cantidad:</span>
                    <div class="cantidad-control">
                        <button id="btn-restar" class="btn btn-sm btn-outline-secondary" type="button">-</button>
                        <span id="cantidad-valor" class="carrito-cantidad">1</span>
                        <button id="btn-sumar" class="btn btn-sm btn-outline-secondary" type="button">+</button>
                    </div>
                </div>

                <button id="btn-agregar-detalle" class="btn btn-success" type="button">Agregar al carrito</button>
            </div>

            <div id="recomendados" class="recomendados" hidden>
                <h3>También te puede interesar</h3>
                <div class="recomendados-grid" id="recomendados-grid"></div>
            </div>

            <div id="detalle-no-encontrado" class="aviso-no-encontrado" hidden>
                <p id="mensaje-no-encontrado"></p>
                <a href="servicios.html">Ver todos los productos</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Veterinaria San Marcos</p>
        <nav>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </footer>

</body>

</html>
